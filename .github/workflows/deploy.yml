name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # stündlich neu bauen, damit die Mitgliederliste mit Discord synchron bleibt
  # (krumme Minute, weil GitHub Läufe zur vollen Stunde oft stark verzögert)
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Standard: https://<owner>.github.io/<repo>/
      # Für die eigene Domain die Repository-Variablen SITE_URL=https://www.vanen.info
      # und BASE_PATH=/ setzen (Settings → Secrets and variables → Actions → Variables).
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7
      # Ohne DISCORD_BOT_TOKEN wird der Schritt übersprungen (nur manuelle Mitglieder)
      - name: Discord-Mitglieder synchronisieren
        run: node scripts/sync-discord.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Guild-ID und Rolle dürfen als Variable oder als Secret angelegt sein
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID || secrets.DISCORD_GUILD_ID }}
          DISCORD_OPTIN_ROLE: ${{ vars.DISCORD_OPTIN_ROLE || secrets.DISCORD_OPTIN_ROLE }}
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
