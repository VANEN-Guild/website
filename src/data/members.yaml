# Mitgliederliste – erscheint unter /mitglieder.
# Bitte nur Mitglieder eintragen, die der Veröffentlichung zugestimmt haben.

# Gruppen in der Reihenfolge, in der sie auf der Seite erscheinen
roles:
  - Leitung
  - Offiziere
  - Mitglieder

# Discord-Sync: Mitglieder mit der Opt-in-Rolle (z. B. „Website“) werden automatisch ergänzt.
# Wer unten manuell eingetragen ist (gleiche discordId oder gleicher discord-Name), wird vom Sync ignoriert.
discord:
  # Gruppe für alle, die keine der folgenden Discord-Rollen haben
  defaultRole: Mitglieder
  # Gruppe auf der Seite → Discord-Rollennamen (die erste passende Gruppe gewinnt)
  roles:
    Leitung: [LEAD]
    Offiziere: [Offizier, Offiziere, "WoW Forever: Officer"]
  # Spiel auf der Seite → Discord-Rollennamen (alle passenden Spiele werden angezeigt)
  games:
    DAoC: [DAoC]
    New World: [New World]
    WoW: [WoW]
    Rift: [RIFT]
    Diablo: [Diablo]
    WAR: [WAR]

# Ergänzungen für Mitglieder aus dem Discord-Sync: Name, Gruppe und Avatar kommen weiter aus Discord,
# since, games und bio von hier ("dabei seit" erscheint nur, wenn since hier angegeben ist;
# games werden mit den Spielen aus den Discord-Rollen zusammengeführt).
# Zuordnung über discord (Benutzername) oder discordId.
extras:
#  - discord: alice
#    since: 2001
#    games: [Rift]
