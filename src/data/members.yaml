  # discord:   Discord-Benutzername (optional)
  # discordId: Discord-Benutzer-ID in Anführungszeichen, verlinkt das Profil (optional)
  # since:     dabei seit (Jahr, optional)
  # games:     gespielte Spiele (optional)
  # bio:       kurzer Text, max. 280 Zeichen (optional)

